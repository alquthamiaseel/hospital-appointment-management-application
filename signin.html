<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="p-5 bg-blue-600 text-white">
        <h1 class="text-3xl font-bold">Sign In</h1>
        <nav class="mt-2">
            <a href="index.html">Home</a>
        </nav>
    </header>
    <main class="p-5">
        <form class="bg-white p-5 rounded shadow-md">
            <label class="block mb-4">
                <span class="text-gray-700">Email</span>
                <input type="email" class="mt-1 block w-full border-gray-300 rounded-md" required>
            </label>
            <label class="block mb-4">
                <span class="text-gray-700">Password</span>
                <input type="password" class="mt-1 block w-full border-gray-300 rounded-md" required>
            </label>
            <button type="submit" class="w-full bg-blue-600 text-white rounded p-2">Log In</button>
        </form>
    </main>
</body>
</html>
