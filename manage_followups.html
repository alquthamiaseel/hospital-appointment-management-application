<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Follow-ups</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="p-5 bg-blue-600 text-white">
        <h1 class="text-3xl font-bold">Manage Follow-ups</h1>
        <nav class="mt-2">
            <a href="index.html">Home</a>
        </nav>
    </header>
    <main class="p-5">
        <form class="bg-white p-5 rounded shadow-md">
            <label class="block mb-4">
                <span class="text-gray-700">Select Appointment</span>
                <select class="mt-1 block w-full border-gray-300 rounded-md">
                    <option>Follow-up with Dr. Smith</option>
                    <option>Follow-up with Dr. Johnson</option>
                </select>
            </label>
            <label class="block mb-4">
                <span class="text-gray-700">Next Follow-up Date</span>
                <input type="date" class="mt-1 block w-full border-gray-300 rounded-md" required>
            </label>
            <button type="submit" class="w-full bg-blue-600 text-white rounded p-2">Schedule Follow-up</button>
        </form>
    </main>
</body>
</html>
